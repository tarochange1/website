<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 MFA 第二回 講習会 競技規則テスト</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --print-color: #27ae60;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e9ecef;
            --correct-bg: #e8f5e9;
            --correct-color: #2e7d32;
            --wrong-bg: #ffebee;
            --wrong-color: #c62828;
            --unanswered-border: #e74c3c;
            --unanswered-bg: #fdf2f2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p.desc {
            color: #666;
            font-size: 0.95rem;
            margin: 0;
        }

        /* 氏名入力エリア */
        .user-info-card {
            background: #eef2f7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .user-info-card label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .user-info-card input[type="text"] {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .question-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.25s ease;
        }

        /* 未回答エラー時のハイライト */
        .question-card.has-error {
            border: 2px solid var(--unanswered-border);
            background-color: var(--unanswered-bg);
        }

        .question-title {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .options {
            display: flex;
            gap: 20px;
        }

        .option-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px 20px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-weight: bold;
            flex: 1;
            justify-content: center;
            transition: background 0.2s;
        }

        .option-label:hover {
            background: #e2e6ea;
        }

        .option-label input {
            margin-right: 8px;
            transform: scale(1.2);
        }

        .btn-container {
            text-align: center;
            margin: 30px 0;
        }

        button.btn-submit {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
            transition: background 0.2s, transform 0.1s;
        }

        button.btn-submit:hover {
            background: #2980b9;
        }

        button.btn-submit:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        /* 印刷・PDF保存ボタン */
        button.btn-print {
            background: var(--print-color);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
            transition: background 0.2s;
        }

        button.btn-print:hover {
            background: #219653;
        }

        /* 結果表示部 */
        #result-area {
            display: none;
            text-align: center;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 8px;
            background: #eef2f7;
            border: 2px solid #cbd5e1;
        }

        #result-area h2 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
        }

        .score-box {
            margin: 15px 0;
        }

        .score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--secondary-color);
        }

        /* 解説カード */
        .feedback {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .is-correct {
            border-left: 5px solid var(--correct-color);
            background: var(--correct-bg);
            color: var(--correct-color);
        }

        .is-wrong {
            border-left: 5px solid var(--wrong-color);
            background: var(--wrong-bg);
            color: var(--wrong-color);
        }

        /* 印刷・PDF出力用スタイル */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .btn-container,
            button.btn-print,
            .user-info-card {
                display: none !important;
            }
            #result-area {
                display: block !important;
                border: 1px solid #333;
                page-break-after: avoid;
            }
            .question-card {
                border: 1px solid #ddd;
                page-break-inside: avoid;
                margin-bottom: 15px;
            }
            .feedback {
                display: block !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>2026 MFA 第二回 講習会<br>競技規則テスト問題</h1>
        <p class="desc">各設問の文章が正しければ「〇」、間違っていれば「×」を選択してください。<br>※すべての問題に回答してから「採点する」を押してください。</p>
    </header>

    <!-- 氏名入力欄 -->
    <div class="user-info-card" id="user-info-box">
        <label for="user-name">お名前（受講者名） <span style="color:red;">*必須</span></label>
        <input type="text" id="user-name" placeholder="例: 三鷹 太郎" required>
    </div>

    <!-- 採点結果表示部 -->
    <div id="result-area">
        <h2>採点結果</h2>
        <div style="font-size: 1.1rem;">受講者: <strong id="res-user-name">-</strong> 様</div>
        <div class="score-box">
            <div style="font-size: 1rem; color: #555;">正解数: <span id="correct-count">0</span> / 40問</div>
            <div class="score"><span id="score-val">0</span> 点 <span style="font-size: 1.2rem; color: #666;">/ 100点</span></div>
        </div>
        <div>
            <button type="button" class="btn-print" onclick="window.print()">📄 結果を印刷 / PDF保存</button>
        </div>
    </div>

    <form id="quiz-form">
        <div id="questions-list"></div>
        <div class="btn-container">
            <button type="button" class="btn-submit" id="submit-btn" onclick="validateAndGrade()">採点する</button>
        </div>
    </form>
</div>

<script>
const quizData = [
    { text: "1. 自陣でのオフサイドポジションはない。", ans: "O", exp: "正しい（〇）。ハーフウェーラインより自陣側にいる競技者は、オフサイドポジションにはなりません。" },
    { text: "2. オフサイドポジションとは相手陣内のゴールラインから2番目以内に近い位置にいる事である。", ans: "O", exp: "正しい（〇）。相手陣内において「後方から2人目の相手競技者（GK含む）」よりゴールラインに近い位置にいる状態を指します。" },
    { text: "3. オフサイドポジションにいる味方にパスを出した瞬間にオフサイドが成立するが、オフサイドとなるかどうかは分からない。", ans: "O", exp: "正しい（〇）。オフサイドの判定基準となるタイミングは「味方がボールを触った/プレーした瞬間」ですが、実際にプレーや相手に関与・干渉するまでは反則にはなりません。" },
    { text: "4. オフサイドポジションにいる味方にスローインでパスした場合、オフサイドとなった。", ans: "X", exp: "誤り（×）。スローインから直接ボールを受けた場合はオフサイドになりません。" },
    { text: "5. オフサイドポジションにいる味方にGKがパントキックでパスをした場合、オフサイドとなった。", ans: "O", exp: "正しい（〇）。インプレー中のGKによるキック（パントキック含む）からのパスには、オフサイドが適用されます。" },
    { text: "6. オフサイドポジションにいる味方にGKがゴールキックでパスをした場合、オフサイドとなった。", ans: "X", exp: "誤り（×）。ゴールキックから直接ボールを受けた場合はオフサイドになりません。" },
    { text: "7. オフサイドポジションにいる味方にフリーキックでパスをした場合、オフサイドとなった。", ans: "O", exp: "正しい（〇）。フリーキックからの再開時はオフサイドの適用対象となります。" },
    { text: "8. オフサイドポジションにいる味方にフリーキックでパスをしたが、相手選手がボールを取ったのでオフサイドとならなかった。", ans: "O", exp: "正しい（〇）。ボールや相手競技者に関与・干渉することなく相手選手がボールを保持した場合、オフサイドの反則は成立しません。" },
    { text: "9. オフサイドポジションいる味方にパスを出したがGKがキャッチしたのでオフサイドとならない場合がある。", ans: "O", exp: "正しい（〇）。攻撃側がGKの視界を遮ったりプレーを妨害せず、直接ボールに触れなかった場合、オフサイドを取らないケースがあります。" },
    { text: "10. ドリブル突破をした選手が相手陣内のオフサイドポジションの位置まで侵入した場合、最終ラインは保持している選手の位置となる。", ans: "X", exp: "誤り（×）。オフサイドの基準線となるのは選手自身ではなく「ボールの位置」です。ボールより後方にいる味方はオフサイドになりません。" },
    { text: "11. コーナーキックの際に味方がオフサイドポジションにいる場合はコーナーキックを蹴った瞬間にオフサイドとなる。", ans: "X", exp: "誤り（×）。コーナーキックから直接ボールを受けた場合はオフサイドになりません。" },
    { text: "12. オフサイドポジションにいる者に敵が間違ってパスをしてしまったがオフサイドとなった。", ans: "X", exp: "誤り（×）。相手チームの意図的なプレー（パスミス含む）からボールを受けた場合、オフサイドの反則にはなりません。" },
    { text: "13. フリーキックの際に味方選手がオフサイドポジションにいたがフリーキックの軌道とは反対側にいたためオフサイドとはならなかった。", ans: "O", exp: "正しい（〇）。オフサイドポジションにいるだけでは反則にならず、ボールの軌道と反対側にいてプレーに関与・干渉していなければオフサイドになりません。" },
    { text: "14. ボールを保持していた選手が、前方にボールを蹴った際、ボールを避ける事が出来なかった敵の選手の体にあたり、反対側でオフサイドポジションにいた選手のところに飛んで行ったので、オフサイドとなった。", ans: "O", exp: "正しい（〇）。相手選手が避けきれずに当たったボール（意図的ではない跳ね返り・リバウンド）から利益を得たため、オフサイドの反則となります。" },
    { text: "15. フリーキックの際に前方にボールを蹴ったが、審判員にぶつかりオフサイドポジションにいた選手のところに飛んで行った。この場合はオフサイドとはならず、フリーキックのやり直しとなる。", ans: "X", exp: "誤り（×）。審判員に当たって大きなチャンスになった場合はフリーキックのやり直しではなく「ドロップボール」で再開となります。" },
    { text: "16. ボールを保持していた選手が、シュートをした際にゴールポストに当たりオフサイドポジションにいた味方の選手のところに飛んで行き、そのボールをシュートした。この場合はオフサイドとなる。", ans: "O", exp: "正しい（〇）。ゴールポスト等の跳ね返り（リバウンド）をプレーして利益を得たため、オフサイドの反則となります。" },
    { text: "17. シュートをGKがパンチングで意図的にピッチ外にクリアしようとしたが、反対側のオフサイドポジションにいた敵の前に飛んで行きそのボールをシュートした。この場合はオフサイドとなる。", ans: "X", exp: "誤り（×）。GKによる「意図的なクリア・プレー」から相手競技者にボールが渡ったため、オフサイドとはなりません。" },
    { text: "18. ゴールキックをオフサイドポジションにいる敵がインターセプトしたがオフサイドとなった。", ans: "X", exp: "誤り（×）。相手（守備側チーム）が蹴ったボールを奪ったものであるため、オフサイドにはなりません。" },
    { text: "19. オフサイドポジションにいる選手に味方がパスを出したが、ボールを受け取った時にはオフサイドポジションではなかった為、オフサイドとはならなかった。", ans: "X", exp: "誤り（×）。判定の基準は「味方がボールをパス（プレー）した瞬間」の位置であるため、ボールを受けるためにオンサイド側へ戻ってもオフサイドとなります。" },
    { text: "20. オフサイドポジションにいる選手に味方がパスを出したが、プレーを行わなかった為、オフサイドとならなかった。", ans: "O", exp: "正しい（〇）。オフサイドポジションにいても、ボールを触らず相手競技者にも干渉しなければ反則は取られません。" },
    { text: "21. ゴールキックの際に5秒以内にゲームを再開(キック)しなかった為、遅延行為とみなされ相手チームの間接フリーキックとなった。", ans: "X", exp: "誤り（×）。ゴールキックに5秒制限の規定はありません。過度な時間浪費に対しては警告（イエロー）が出されますが、相手の間接フリーキックにはなりません。" },
    { text: "22. スローインの際に、大幅にポイントを間違えてスローインをしてしまった。反則となり相手チームのスローインとなった。", ans: "O", exp: "正しい（〇）。正しい場所以外からのスローインは手順違反となり、相手チームのスローインで再開されます。" },
    { text: "23. GKが相手選手とペナルティエリア外にて決定的な場面(1対1)となり、シュートを阻止しようとボールに対してスライディングタックルを行ったが、結果的にファールとなり「フリーキック及びレッドカード」退場となった。", ans: "O", exp: "正しい（〇）。ペナルティエリア外での決定的な得点機会の阻止（DOGSO）は、ボールへの意図があっても一律レッドカード（退場）となります。" },
    { text: "24. GKが相手選手とペナルティエリア内にて決定的な場面(1対1)となり、シュートを阻止しようとスライディングタックルを行い、結果的にファールとなった為「PK及びレッドカード」退場となった。", ans: "X", exp: "誤り（×）。ペナルティエリア内でボールにプレーしようと試みた上での反則の場合、三重罰の軽減規定により退場ではなく「警告（イエローカード）」となります。" },
    { text: "25. ディフェンス選手が自陣ゴール前で相手と決定的な場面(1対1)となり、ファールで阻止したので、レッドカード退場処分となった。", ans: "O", exp: "正しい（〇）。決定的な得点機会の阻止（DOGSO）に該当するため、退場処分となります。" },
    { text: "26. 直接フリーキックをGKにパスしたが、GKが気が付いておらず、そのまま直接自陣(誰も触っていない)のゴールに入ってしまいオウンゴールとなった。", ans: "X", exp: "誤り（×）。フリーキックが直接自陣のゴールに入った場合、オウンゴール（得点）にはならず、相手チームのコーナーキックで再開となります。" },
    { text: "27. ドロップボールを直接シュートし、ゴールインとなったが、反則となり相手チームのゴールキックとなった。", ans: "X", exp: "誤り（×）。2人以上の競技者が触れる前に直接ゴールに入った場合は得点にならず相手のゴールキックになりますが、これは「反則」ではありません（再開の手順）。" },
    { text: "28. ドロップボールで再開される場合は、敵チームの選手は7m離れなければならない。", ans: "X", exp: "誤り（×）。ドロップボール時に離れなければならない規定距離は「少なくとも4m」です。" },
    { text: "29. ペナルティエリア内の地点でドロップボールでの再開となった為、審判員は攻撃側が保持していたボールではあったが、GKにドロップし、プレーを再開した。", ans: "O", exp: "正しい（〇）。ペナルティエリア内でプレーが停止した場合、最後に触れたチームに関わらず、守備側のGKにドロップします。" },
    { text: "30. フリーキックの際、敵チーム選手が近づいてきたので、クイックプレーは止めて、敵チーム選手を規定の位置まで離れる様に主審に申告した。", ans: "O", exp: "正しい（〇）。キッカーは主審に規定距離（9.15m）離れるよう要求し、主審の笛の合図による再開を待つことが認められています。" },
    { text: "31. 攻撃中に味方選手がファールで倒されたが、こぼれ球を味方が保持し攻めが続いたので審判員はファールを取らずゲームを続行した。", ans: "O", exp: "正しい（〇）。ファウルされた側に明らかな利益が生じているため、アドバンテージを適用してプレーを続行させることができます。" },
    { text: "32. 攻撃中に味方選手がファールで倒されたが、こぼれ球を味方が保持し攻めが続いたので審判員はアドバンテージを宣言しゲームを続行したが、すぐにボールを敵に奪われた為、ゲームを止め、場面を戻し、ファールされた選手チームのフリーキックでゲームを再開した。", ans: "O", exp: "正しい（〇）。アドバンテージが数秒以内に実現しなかった場合、主審は元のファウル地点まで戻してフリーキックで再開できます。" },
    { text: "33. オフサイドポジションにいる選手にパスが出た時、味方に渡らずGKがボールを取ったのでオフサイドとならなかった。", ans: "O", exp: "正しい（〇）。オフサイドポジションにいた選手が相手やGKに干渉せず関与しなかった場合、インプレーのままゲームが続行されます。" },
    { text: "34. 怪我をした選手にコーチがピッチ内に入り応急処置を行った結果復帰出来そうなのでそのままプレーを続けた。", ans: "X", exp: "誤り（×）。チームスタッフがピッチ内に入って応急処置を受けた選手は、原則として一度ピッチ外に出なければなりません。" },
    { text: "35. 怪我をした選手が一度ピッチ外に出て治療をした結果、復帰出来そうなので予備審判員に許可を得てピッチ内に戻った。", ans: "X", exp: "誤り（×）。ピッチへの復帰の合図・許可を出せるのは「主審」のみです（第4の審判員／予備審判員にはその権限はありません）。" },
    { text: "36. ゲーム中のPKでキッカーが蹴ったボールがゴールポストに当たり跳ね返ってきたのでPKを蹴ったキッカーが再度キックしゴールを決め得点となった。", ans: "X", exp: "誤り（×）。他の競技者が触れる前にキッカーが連続して触れたため「二度蹴り（相手の間接フリーキック）」となり、得点は認められません。" },
    { text: "37. 主審の許可なくピッチ外へ出て靴ひもを直していたのでレッドカード退場となった。", ans: "X", exp: "誤り（×）。用具の調整等でピッチ外に出ること自体は退場（レッドカード）にはなりません。" },
    { text: "38. 給水タイムにベンチにもどり着席して休憩をとった。", ans: "X", exp: "誤り（×）。「飲水タイム（給水）」では選手はピッチ内に留まる必要があります（ベンチに戻れるのは「クーリングブレイク」のみ）。" },
    { text: "39. 出血を伴うけがをした場合、完全に止血し、ユニフォーム等に血が付いていないことを予備審判員に確認してもらう必要がある。", ans: "O", exp: "正しい（〇）。出血が完全に止まり、用具に血液が付着していないことを審判員等に確認してもらう必要があります。" },
    { text: "40. 怪我をした選手がいたので、相手チームがボールを保持していたが、タッチラインに蹴りだしゲームを止めた。再開は怪我をしたチームのスローインからの再開となったが、相手チームヘボールを渡しゲームを再開した。ルールにはないがフェアプレーの精神と言って良い。", ans: "O", exp: "正しい（〇）。競技規則上の義務ではありませんが、古くから尊重されているフェアプレー精神に基づく慣習です。" }
];

// 設問の描画
const listContainer = document.getElementById("questions-list");
quizData.forEach((q, index) => {
    const qNum = index + 1;
    const card = document.createElement("div");
    card.className = "question-card";
    card.id = `card-${qNum}`;
    card.innerHTML = `
        <div class="question-title">${q.text}</div>
        <div class="options">
            <label class="option-label">
                <input type="radio" name="q${qNum}" value="O" onchange="clearError(${qNum})"> 〇
            </label>
            <label class="option-label">
                <input type="radio" name="q${qNum}" value="X" onchange="clearError(${qNum})"> ×
            </label>
        </div>
        <div class="feedback" id="feedback-${qNum}"></div>
    `;
    listContainer.appendChild(card);
});

// 未回答エラーの解除
function clearError(qNum) {
    const card = document.getElementById(`card-${qNum}`);
    if (card) {
        card.classList.remove("has-error");
    }
}

// 採点チェック・確認
function validateAndGrade() {
    // 1. 氏名の入力チェック
    const userNameInput = document.getElementById("user-name");
    const userName = userNameInput.value.trim();
    if (!userName) {
        alert("【確認】お名前（受講者名）を入力してください。");
        userNameInput.focus();
        userNameInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }

    // 2. 未回答チェック
    const unansweredList = [];
    quizData.forEach((_, index) => {
        const qNum = index + 1;
        const selected = document.querySelector(`input[name="q${qNum}"]:checked`);
        const card = document.getElementById(`card-${qNum}`);

        if (!selected) {
            unansweredList.push(qNum);
            card.classList.add("has-error");
        } else {
            card.classList.remove("has-error");
        }
    });

    if (unansweredList.length > 0) {
        const errorNums = unansweredList.slice(0, 10).join(", ");
        const extraText = unansweredList.length > 10 ? " ほか" : "";
        alert(`【未回答の問題があります】\n\n以下の問題に回答していません（残り ${unansweredList.length} 問）：\n問: ${errorNums}${extraText}\n\nすべての問題に回答してから採点を行ってください。`);
        
        const firstUnansweredCard = document.getElementById(`card-${unansweredList[0]}`);
        if (firstUnansweredCard) {
            firstUnansweredCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
    }

    // 3. 採点実行の確認ダイアログ
    const confirmResult = confirm("全40問への回答が完了しました。\n\n採点してもよろしいですか？");
    if (!confirmResult) {
        return;
    }

    // 4. 採点処理を実行
    executeGrading(userName);
}

// 採点と結果表示
function executeGrading(userName) {
    const submitBtn = document.getElementById("submit-btn");
    submitBtn.disabled = true;
    submitBtn.innerText = "採点完了";

    let score = 0;
    quizData.forEach((q, index) => {
        const qNum = index + 1;
        const selected = document.querySelector(`input[name="q${qNum}"]:checked`);
        const feedback = document.getElementById(`feedback-${qNum}`);
        feedback.style.display = "block";

        const correctSymbol = q.ans === 'O' ? '〇' : '×';
        if (selected.value === q.ans) {
            score++;
            feedback.className = "feedback is-correct";
            feedback.innerHTML = `<strong>【正解 (${correctSymbol})】</strong><br>${q.exp}`;
        } else {
            feedback.className = "feedback is-wrong";
            feedback.innerHTML = `<strong>【不正解】</strong> 正解は「${correctSymbol}」です。<br>${q.exp}`;
        }
    });

    // 40問・各2.5点換算で100点満点
    const points = (score * 2.5).toFixed(1).replace('.0', '');

    // 結果表示エリアに値を反映
    document.getElementById("res-user-name").innerText = userName;
    document.getElementById("correct-count").innerText = score;
    document.getElementById("score-val").innerText = points;

    const resultArea = document.getElementById("result-area");
    resultArea.style.display = "block";
    resultArea.scrollIntoView({ behavior: 'smooth' });
}
</script>
